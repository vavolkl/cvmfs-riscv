name: cloudtests_riscv
on:
  pull_request:
    branches: [devel, cvmfs*]
  workflow_dispatch:

jobs:
  # Fan out a package build across distro containers on the native riscv64
  # runner. Each entry becomes its own reusable-workflow run (ci_riscv_package.yml).
  # fail-fast is off so one distro's failure doesn't cancel the others.
  #
  # These are build-only: the runners have no systemd, so we can't install the
  # packages (postinst runs cvmfs_config/autofs) or run the integration suite
  # here. Integration testing lives in the QEMU workflow (ci_qemu.yml).
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: debian-trixie, container: 'debian:trixie' }
          - { id: ubuntu-24.04,  container: 'ubuntu:24.04' }
          - { id: fedora-44,     container: 'fedora:44' }
          # riscv64 for EL is still experimental; kept in the matrix but expect
          # occasional red until upstream images stabilise.
          - { id: almalinux-9,   container: 'almalinux:9' }
    uses: ./.github/workflows/ci_riscv_package.yml
    with:
      id: ${{ matrix.id }}
      container: ${{ matrix.container }}
